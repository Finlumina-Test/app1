<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoot & Merge - Play Now!</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif; /* Updated font */
            /* Dark Theme Background */
            background: #1a1a2e; 
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            overflow: hidden; /* Prevent scrolling outside the game area */
        }

        .game-container {
            background: #0f0c29; /* Darker container background */
            /* Border and Shadow to make it look like a distinct app/screen */
            border: none; 
            width: 100%;
            height: 100vh; /* Fill the iframe or screen */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .game-header {
            background: rgba(255, 255, 255, 0.05); /* Subtle glass effect */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .game-header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
            color: #fff;
            letter-spacing: 1px;
        }

        .score-display {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Make score numbers pop with Gold color */
        #score, #highScore {
            color: #FFD700;
            font-weight: 700;
            margin-left: 5px;
        }

        .canvas-wrapper {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            background: #1a1a2e; /* Match body background */
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            background: #faf8ef; /* Keep game board light for contrast with balls */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: crosshair;
            touch-action: none;
        }

        .game-info {
            padding: 10px 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85em;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        /* Game Over Overlay Styles */
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 12, 41, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 1000;
            min-width: 280px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        #gameOver h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: #FF6B6B; /* Accent color */
        }

        #gameOver .final-score {
            font-size: 1.2em;
            margin: 10px 0;
            color: rgba(255, 255, 255, 0.8);
        }
        
        #gameOver strong {
            color: #FFD700;
            font-size: 1.4em;
        }

        .btn {
            background: #FFD700;
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Shoot & Merge</h1>
            <div class="score-display">
                <div>SCORE <span id="score">0</span></div>
                <div>BEST <span id="highScore">0</span></div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="450" height="700"></canvas>

            <div id="gameOver">
                <h2>GAME OVER</h2>
                <div class="final-score">Score: <strong id="finalScore">0</strong></div>
                <div class="final-score">Best: <strong id="finalBest">0</strong></div>
                <button class="btn" onclick="restartGame()">REPLAY</button>
            </div>
        </div>

        <div class="game-info">
            Drag to aim • Release to shoot • Merge numbers
        </div>
    </div>

    <script src="game.js"></script> 
</body>
</html>
